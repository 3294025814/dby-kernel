name: Build Kernel for DBY-W09

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git python3 zip unzip wget gcc-aarch64-linux-gnu

    - name: Fix script permissions
      working-directory: Code_Opensource/kernel
      run: |
        chmod +x scripts/*

    - name: Build kernel
      working-directory: Code_Opensource/kernel
      run: |
        export CROSS_COMPILE=aarch64-linux-gnu-
        export ARCH=arm64
        make merge_kona_defconfig
        make -j$(nproc) Image.gz-dtb

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: Code_Opensource/kernel/arch/arm64/boot/Image.gz-dtb
