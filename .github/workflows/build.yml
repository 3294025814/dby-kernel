name: Build Kernel for DBY-W09

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git python3 zip unzip wget gcc-aarch64-linux-gnu python2

    - name: Fix script permissions and syntax
      working-directory: Code_Opensource/kernel
      run: |
        # Fix Windows CRLF line endings to Linux LF
        find scripts -name "*.sh" -exec sed -i 's/\r$//' {} \;
        chmod +x scripts/*
        # Replace gcc-version.sh with simple script to avoid printf compatibility issues
        echo '#!/bin/bash' > scripts/gcc-version.sh
        echo 'echo "100300"' >> scripts/gcc-version.sh
        chmod +x scripts/gcc-version.sh
        # Convert Python 2 print statements to Python 3
        find scripts -name "*.py" -exec sed -i 's/print \(.*\)/print(\1)/g' {} \;

    - name: Build kernel
      working-directory: Code_Opensource/kernel
      shell: bash
      run: |
        export CROSS_COMPILE=aarch64-linux-gnu-
        export ARCH=arm64
        make merge_kona_defconfig
        make -j$(nproc) Image.gz-dtb

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: Code_Opensource/kernel/arch/arm64/boot/Image.gz-dtb
