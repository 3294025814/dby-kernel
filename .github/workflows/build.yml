name: Build Kernel for DBY-W09on:  workflow_dispatch:  push:    branches: [ main ]jobs:  build:    runs-on: ubuntu-latest    steps:    - name: Checkout source      uses: actions/checkout@v4    - name: Install dependencies      run: |        sudo apt-get update        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git python3 zip unzip wget    - name: Setup toolchain      run: |        wget -q https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/aarch64-linux-gnu/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz        tar -xf gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz        echo "TOOLCHAIN_PATH=$PWD/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu/bin" >> $GITHUB_ENV    - name: Download kernel source from Release      run: |        wget -O source.tar.gz https://github.com/3294025814/dby-kernel/releases/download/v1.0/DBY-W09_HarmonyOS3_0_0_opensource.tar.gz        mkdir -p Code_Opensource        tar -xzf source.tar.gz -C Code_Opensource/    - name: Build kernel      working-directory: Code_Opensource/kernel      run: |        export CROSS_COMPILE=$TOOLCHAIN_PATH/aarch64-linux-gnu-        export ARCH=arm64        make merge_kona_defconfig        make -j$(nproc) Image.gz-dtb    - name: Upload kernel image      uses: actions/upload-artifact@v4      with:        name: kernel-image        path: Code_Opensource/kernel/arch/arm64/boot/Image.gz-dtb
