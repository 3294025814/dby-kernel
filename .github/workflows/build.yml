name: Build Kernel for DBY-W09

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git python3 zip unzip wget gcc-aarch64-linux-gnu

    - name: Fix script permissions and syntax
      working-directory: Code_Opensource/kernel
      run: |
        # Fix Windows CRLF line endings to Linux LF
        find scripts -name "*.sh" -exec sed -i 's/\r$//' {} \;
        chmod +x scripts/*
        # Convert Python 2 print statements to Python 3
        find scripts -name "*.py" -exec sed -i 's/print \(.*\)/print(\1)/g' {} \;

    - name: Fix gcc-version.sh
      working-directory: Code_Opensource/kernel
      run: |
        # Replace gcc-version.sh with simple version check
        echo '#!/bin/bash' > scripts/gcc-version.sh
        echo 'echo "10.0.7"' >> scripts/gcc-version.sh
        chmod +x scripts/gcc-version.sh

    - name: Build kernel
      shell: bash
      run: |
        # Create missing prebuilts ccache directory in repo root and symlink system ccache
        mkdir -p prebuilts/misc/linux-x86/ccache
        ln -sf /usr/bin/ccache prebuilts/misc/linux-x86/ccache/ccache
        cd Code_Opensource/kernel
        export CROSS_COMPILE=aarch64-linux-gnu-
        export ARCH=arm64
        export CC=aarch64-linux-gnu-gcc
        export HOSTCC=gcc
        export CXX=aarch64-linux-gnu-g++
        export HOSTCXX=g++
        export CCACHE_DISABLE=1
        make merge_kona_defconfig
        make -j$(nproc) Image.gz-dtb

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: Code_Opensource/kernel/arch/arm64/boot/Image.gz-dtb
